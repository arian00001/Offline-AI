name: DEV STYLE AI Server APK

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Checkout private repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK, CMake and NDK
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0" "cmake;3.22.1" "ndk;27.2.12479018"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Validate project files
        run: |
          python3 - <<'PYCODE'
          import xml.etree.ElementTree as ET
          ET.parse('app/src/main/AndroidManifest.xml')
          assert 'GIT_TAG b10931' in open('app/src/main/cpp/CMakeLists.txt').read()
          assert 'setContentView(root)' in open('app/src/main/java/site/devstyle/aiserver/MainActivity.kt').read()
          assert 'renderErrors()' in open('app/src/main/java/site/devstyle/aiserver/MainActivity.kt').read()
          print('Manifest XML and required source markers validated.')
          PYCODE

      - name: Build debug APK
        shell: bash
        run: |
          set -o pipefail
          gradle --no-daemon --stacktrace assembleDebug 2>&1 | tee build.log

      - name: Upload debug APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: dev-style-ai-server-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14

      - name: Upload build log for diagnosis
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dev-style-ai-server-build-log
          path: build.log
          if-no-files-found: ignore
          retention-days: 14
